<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NITFLEX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== INTRO ANIMATION ===== -->
  <div id="intro" class="intro">
    <div class="intro-stage">
      <div class="intro-ring"></div>
      <div class="intro-ring ring-2"></div>
      <h1 class="intro-logo" id="introLogo"></h1>
      <div class="intro-beam"></div>
    </div>
    <button class="skip" id="skipIntro">Skip &rsaquo;</button>
  </div>

  <!-- ===== BROWSE PAGE ===== -->
  <div id="app" class="app" hidden>
    <header class="topbar" id="topbar">
      <a class="brand" href="#" id="brand"></a>
      <nav class="nav">
        <a href="#" class="active">Home</a>
        <a href="#">Shows</a>
        <a href="#">Movies</a>
        <a href="#">New &amp; Popular</a>
        <a href="#">My List</a>
      </nav>
      <div class="actions">
        <button class="icon-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button class="icon-btn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        </button>
        <div class="avatar" title="Profile"></div>
      </div>
    </header>

    <section class="hero">
      <div class="hero-art"></div>
      <div class="hero-fade"></div>
      <div class="hero-content">
        <span class="tag">Featured</span>
        <div class="ph ph-title"></div>
        <div class="ph ph-line"></div>
        <div class="ph ph-line short"></div>
        <div class="hero-buttons">
          <button class="btn btn-primary">&#9654;&nbsp; Play</button>
          <button class="btn btn-secondary">&#9432;&nbsp; More Info</button>
        </div>
      </div>
    </section>

    <main id="rows" class="rows"></main>

    <footer class="footer">
      <p>&copy; <span id="year"></span> <span id="footerBrand"></span> &middot; A personal project</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
